<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller 2: Clasificar una nota</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <a href="../index.html">← Volver al inicio</a>
    <h1>Taller 2: Clasificar una nota</h1>
    <p>Escribe una nota entre 0.0 y 5.0 para conocer su desempeño.</p>
  </header>
  <main>
    <form id="formTaller2" novalidate>
      <label for="nota">Nota (0.0 a 5.0)</label>
      <input type="number" id="nota" step="any">
      <div class="botones">
        <input type="submit" value="Clasificar">
        <input type="reset" value="Limpiar">
      </div>
    </form>
    <p id="resultado" class="mensaje"></p>
  </main>
  <!-- El script va al final del body para que el HTML ya exista cuando JS lo busca -->
  <script src="../js/taller2.js"></script>
</body>
</html>
