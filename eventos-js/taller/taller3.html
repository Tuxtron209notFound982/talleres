<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller 3: El mayor de tres números</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <a href="../index.html">← Volver al inicio</a>
    <h1>Taller 3: El mayor de tres números</h1>
    <p>Compara tres números usando condicionales.</p>
  </header>
  <main>
    <form id="formTaller3" novalidate>
      <label for="numeroA">Número A</label>
      <input type="number" id="numeroA" step="any">
      <label for="numeroB">Número B</label>
      <input type="number" id="numeroB" step="any">
      <label for="numeroC">Número C</label>
      <input type="number" id="numeroC" step="any">
      <div class="botones">
        <input type="submit" value="Comparar">
        <input type="reset" value="Limpiar">
      </div>
    </form>
    <p id="resultado" class="mensaje"></p>
  </main>
  <!-- El script va al final del body para que el HTML ya exista cuando JS lo busca -->
  <script src="../js/taller3.js"></script>
</body>
</html>
